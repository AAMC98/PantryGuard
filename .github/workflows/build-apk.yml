name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias de Node
        run: npm install

      - name: Compilar Frontend y Servidor
        run: npm run build

      - name: Sincronizar Plataforma Android (Capacitor)
        run: npx cap sync android

      - name: Asignar Permisos de Ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK Generado como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: PantryGuard-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
